<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Catálogo{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; color: #222; background: #f5f6f8; }
        header { background: #17324d; color: white; padding: 1rem 2rem; }
        nav a { color: white; margin-right: 1rem; text-decoration: none; }
        main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
        .actions, .filters { display: flex; gap: .75rem; flex-wrap: wrap; align-items: end; }
        .filters { background: white; padding: 1rem; margin: 1rem 0; }
        input, textarea, select { padding: .55rem; border: 1px solid #bbb; border-radius: 4px; width: 100%; box-sizing: border-box; }
        label { display: block; font-weight: bold; margin-bottom: .25rem; }
        .field { min-width: 160px; flex: 1; }
        button, .button { background: #1769aa; color: white; border: 0; border-radius: 4px; padding: .6rem .9rem; text-decoration: none; cursor: pointer; display: inline-block; }
        .button.danger { background: #b42318; }
        .button.secondary { background: #667085; }
        table { background: white; width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: .8rem; border-bottom: 1px solid #e5e7eb; }
        .messages { padding: 0; list-style: none; }
        .messages li { background: #d1fadf; padding: .75rem; margin-bottom: .5rem; }
        .empty { background: white; padding: 1.5rem; text-align: center; }
        .form-card { max-width: 650px; background: white; padding: 1.5rem; }
        .form-row { margin-bottom: 1rem; }
        .errorlist { color: #b42318; }
        .warning { color: #9a3412; background: #ffedd5; padding: .75rem; }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'catalogo:produto_lista' %}">Produtos</a>
            <a href="{% url 'catalogo:categoria_lista' %}">Categorias</a>
            <a href="{% url 'catalogo:produto_criar' %}">Novo produto</a>
            <a href="{% url 'carrinho:detalhe' %}">Carrinho ({{ carrinho_quantidade }})</a>
        </nav>
    </header>
    <main>
        {% if messages %}
            <ul class="messages">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
